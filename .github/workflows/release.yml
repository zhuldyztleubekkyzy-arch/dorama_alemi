name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dorama_alem
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - name: google-services.json (secret немесе CI placeholder)
        env:
          GS_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GS_JSON" ]; then
            echo "$GS_JSON" | base64 -d > android/app/google-services.json
            echo "Нақты google-services.json secret-тен алынды"
          else
            PKG=$(grep -rhoE 'applicationId[ =]+"[^"]+"' android/app/build.gradle* | head -1 | sed 's/.*"\(.*\)"/\1/')
            [ -n "$PKG" ] || { echo "::error::applicationId табылмады"; exit 1; }
            cat > android/app/google-services.json <<JSON
          {
            "project_info": {"project_number": "000000000000", "project_id": "ci-placeholder", "storage_bucket": "ci-placeholder.appspot.com"},
            "client": [{
              "client_info": {"mobilesdk_app_id": "1:000000000000:android:0000000000000000", "android_client_info": {"package_name": "$PKG"}},
              "api_key": [{"current_key": "placeholder"}],
              "services": {"appinvite_service": {"other_platform_oauth_client": []}}
            }],
            "configuration_version": "1"
          }
          JSON
            echo "::notice::CI placeholder жасалды (package: $PKG). Нақты Firebase қосылымы жоқ"
          fi
      - run: flutter build apk --release
      - run: cp build/app/outputs/flutter-apk/app-release.apk ../dorama-${{ github.ref_name }}.apk
      - name: GitHub Release - DORA deployment оқиғасы
        uses: softprops/action-gh-release@v2
        with:
          files: dorama-${{ github.ref_name }}.apk
          generate_release_notes: true
